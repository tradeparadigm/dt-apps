name: app structure check

# A malformed app is dropped by the server rather than failing it, so a
# mistake here goes missing from the catalogue with nothing to say why.
# Check it where it is made.
on:
  pull_request:
    paths:
      - 'apps/**'
      - '.github/workflows/structure-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The check runs the server's own loader, so there is one set of rules
  # rather than a copy here that drifts from it. Reading the private
  # repository needs a token, and a pull request from a fork does not get one.
  # Failing is the point: an unchecked manifest is the thing this prevents.
  can-check:
    runs-on: ubuntu-latest
    steps:
      - env:
          DIME_TERMINAL_TOKEN: ${{ secrets.DIME_TERMINAL_TOKEN }}
        run: |
          if [ -z "$DIME_TERMINAL_TOKEN" ]; then
            echo "DIME_TERMINAL_TOKEN is not set, so the loader cannot be" >&2
            echo "fetched and this pull request cannot be checked." >&2
            exit 1
          fi

  structure-check:
    needs: can-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: store

      - uses: actions/checkout@v4
        with:
          repository: tradeparadigm/dime-terminal
          token: ${{ secrets.DIME_TERMINAL_TOKEN }}
          path: dime-terminal

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: dime-terminal/api/terminal/go.sum

      - name: Would this load?
        working-directory: dime-terminal/api/terminal
        run: go run ./tools/check-store "$GITHUB_WORKSPACE/store"

name: app structure check

# A malformed app is dropped by the server rather than failing it, so a
# mistake here goes missing from the catalogue with nothing to say why.
# Check it where it is made.
on:
  pull_request:
    paths:
      - 'apps/**'
      - '.github/workflows/structure-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The check runs the server's own loader, so there is one set of rules
  # rather than a copy here that drifts from it. That needs a token to read
  # the private repository, which a pull request from a fork does not get.
  can-check:
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.check.outputs.token }}
    steps:
      - id: check
        env:
          DIME_TERMINAL_TOKEN: ${{ secrets.DIME_TERMINAL_TOKEN }}
        run: |
          if [ -n "$DIME_TERMINAL_TOKEN" ]; then
            echo "token=true" >> "$GITHUB_OUTPUT"
          else
            echo "token=false" >> "$GITHUB_OUTPUT"
            echo "::error::DIME_TERMINAL_TOKEN is not set, so the loader cannot be fetched and this pull request is unchecked."
          fi

  structure-check:
    needs: can-check
    if: needs.can-check.outputs.token == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: store

      - uses: actions/checkout@v4
        with:
          repository: tradeparadigm/dime-terminal
          token: ${{ secrets.DIME_TERMINAL_TOKEN }}
          path: dime-terminal

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: dime-terminal/api/terminal/go.sum

      - name: Would this load?
        working-directory: dime-terminal/api/terminal
        run: go run ./tools/check-store "$GITHUB_WORKSPACE/store"

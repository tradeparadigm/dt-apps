name: app structure check

# A malformed app is dropped by the server rather than failing it, so a mistake
# here goes missing from the catalogue with nothing to say why. Check it where
# it is made.
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/structure-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PyYAML, and the install step is the point. The checker used to scan
      # with regexes to stay stdlib-only, and review found what that costs:
      # `summary: >-` with no body read as the literal ">-" and passed the
      # required-field check, while the consumer's parser resolves it to "" and
      # refuses the app. A checker whose job is to agree with a YAML reader has
      # to be one.
      - name: Install the YAML parser
        run: python3 -m pip install --quiet pyyaml
      - name: Test the checker
        run: python3 scripts/test_check_structure.py

      - name: Test the version bump checker
        run: python3 scripts/test_check_version_bump.py

      - name: Check app structure
        run: python3 scripts/check_structure.py

  # The skills' own tests. They live outside apps/ because everything under a
  # skill is published to a customer pod, so they reach their scripts by skill
  # name through tests/paradigm/skillpath.py.
  skill-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No dependencies on purpose. These run as plain scripts and print their
      # own tally, so a file that imports nothing still has to say "passed".
      - name: Tests that need nothing installed
        run: |
          shopt -s nullglob
          ran=0
          for t in tests/paradigm/*/tests/test_*.py tests/paradigm/harness/test_*.py; do
            if grep -qE '^(import|from) (pytest|polars|duckdb|boto3|pyarrow|obstore)\b' "$t"; then
              continue
            fi
            echo "=== $t"
            out=$(python3 "$t") || { echo "$out"; exit 1; }
            echo "$out"
            # A file that ran nothing prints "0 passed", which still matches
            # *passed*. The digit boundary keeps "110 passed" out of it.
            case "$out" in *passed*) ;; *) echo "no tally printed"; exit 1 ;; esac
            if echo "$out" | grep -qE '(^|[^0-9])0 passed'; then
              echo "ran no checks"; exit 1
            fi
            ran=$((ran + 1))
          done
          [ "$ran" -gt 0 ] || { echo "matched no tests"; exit 1; }
          echo "ran $ran"

  skill-tests-with-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install what the readers need
        run: python -m pip install --quiet pytest polars boto3 duckdb pyarrow obstore

      # BY DIRECTORY, not by grepping for `import pytest`. One of these uses
      # pytest fixtures without importing it, so a grep misses it and running
      # it as a script exits 0 having run nothing.
      - name: Every test that needs a dependency
        run: |
          python -m pytest -q \
            tests/paradigm/paradigm-data-discovery/tests \
            tests/paradigm/paradigm-options-recap/tests/test_direct_inputs.py

  # Edit a skill and leave app.yaml's version alone, and nobody who already
  # installed the app ever sees the change: app_versions is keyed
  # (app_id, version) and written ON CONFLICT DO NOTHING.
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base needs history.
          fetch-depth: 0
      - name: Every changed app changed its version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_version_bump.py

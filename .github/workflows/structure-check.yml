name: app structure check

# DIME Terminal refuses to start on a malformed app, so a mistake here fails
# someone else's deploy. Check the shape where it is made.
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'scripts/check_structure.py'
      - '.github/workflows/structure-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PyYAML, and the install step is the point. The checker used to scan
      # with regexes to stay stdlib-only, and review found what that costs:
      # `summary: >-` with no body read as the literal ">-" and passed the
      # required-field check, while the consumer's parser resolves it to "" and
      # refuses the app. A checker whose job is to agree with a YAML reader has
      # to be one.
      - name: Install the YAML parser
        run: python3 -m pip install --quiet pyyaml
      - name: Check app structure
        run: python3 scripts/check_structure.py

# Market Data. Owns the price and reference data sources an agent reads, and
# later joins them. /ticker reads CoinMarketCap through DIME Terminal's relay
# (the platform's key, held by LiteLLM), else CoinGecko's public API, keyless
# unless a Demo key is enrolled. A coin's on-chain figures come from
# DefiLlama's free API, which needs no key. /stock reads SEC EDGAR, Wikidata
# and trade.xyz's perps on Hyperliquid, all keyless.

schema_version: 1

id: market-data
version: 0.5.0
name: Market Data
blurb: Live crypto and stock market data from slash commands, with no model turn.

access: read-only
maturity: beta

description: |
  Market Data gives you commands that fetch prices directly and answer in the
  chat without using your model.

  Type `/ticker` for the market, `/ticker btc eth` for a table of coins, or
  `/ticker btc` for one coin in full, with its TVL, fees and revenue from
  DefiLlama where it tracks the coin. As you type a symbol, the terminal
  suggests the coins it could be.

  Type `/stock msft` for a US-listed company: its price from trade.xyz's
  perp on Hyperliquid, its CEO and board, its latest financials and its SEC
  filings.

  `/ticker` reads live data from CoinMarketCap on DIME Terminal's own key.
  Where that is not available it reads prices alone from CoinGecko's public API, which works
  with no key but shares a rate limit with everyone on the same network. Add
  a free CoinGecko Demo key for a limit of your own there.

developer: Paradigm
developer_url: https://www.paradigm.co

environments:
  - id: coingecko
    label: CoinGecko
    host: api.coingecko.com

exclusive_credential_types: true

credential_types:
  - id: demo-key
    label: CoinGecko Demo API key
    slug: demo
    secret_label: API key
    routes:
      - path: /api/v3/*
        methods: [GET]
    delivery:
      mode: inject
      header: x-cg-demo-api-key
    summary: >-
      A free key from CoinGecko's developer dashboard. Sets the
      x-cg-demo-api-key header on every request to api.coingecko.com.

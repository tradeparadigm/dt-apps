environments:
  - id: mainnet
    label: Mainnet
    host: api.lyra.finance
  - id: testnet
    label: Testnet
    host: api-demo.lyra.finance
exclusive_credential_types: true
credential_types:
  - id: wallet-key
    label: Wallet key (signing)
    slug: wallet-key
    secret_label: Wallet private key
    detail_fields:
      - key: owner
        label: Owner address
        placeholder: "0x1a2b…"
      - key: signer
        label: Signer address
        placeholder: "0x1a2b… (the owner address, unless you use a session key)"
      - key: subaccount_id
        label: Subaccount id
        placeholder: "12345"
    routes:
      - path: /private/*
        methods: [POST]
    delivery:
      mode: sign
      scheme: secp256k1
      encoding: hex
      match_headers:
        - X-LyraSignature
      match_body: true
    summary: >-
      Sets: signing credential, secp256k1, r||s||v as hex, substituted into
      the X-LyraSignature header and the request body, on POST to /private/*
      only. No public endpoint is touched.

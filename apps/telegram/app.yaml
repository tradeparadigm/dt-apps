# Telegram Bot API. The token goes in the URL path (/bot<token>/<method>), so
# this is replace mode with match_path.

schema_version: 1

id: telegram
version: 1.0.0
name: Telegram
blurb: Send messages to your Telegram chats from a bot whose token your agent never holds.

# What a user would type when asking for what this app does.
tags:
  - telegram
  - telegram bot
  - message me
  - alert me
  - ping me
  - notify me
  - bot
  - my bot

# Not versioned: served from the catalogue listing.
access: read-write
maturity: beta

description: |
  Telegram is a messaging app. Its Bot API lets a bot you own post into chats,
  groups and channels it has been added to.

  This app installs a skill teaching your agent to send messages, photos and
  files through your bot, and to find the chats the bot can reach. You paste
  the **bot token** from BotFather. It stays sealed: your agent sends a
  placeholder and the credential proxy swaps in the token on the way out.

  One bot reaches as many chats as you add it to. Message the bot once, or add
  it to a group or channel, and your agent can find that chat and post there.

  **One bot at a time.** Two Telegram bots enrolled together make each other's
  requests fail, so revoke the old one before enrolling another.

developer: Telegram
developer_url: https://core.telegram.org/bots/api
tint: "#26A5E4"
icon:
  path: "M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"
  view_box: "0 0 24 24"
environments:
  - id: api
    label: Bot API
    host: api.telegram.org

exclusive_credential_types: true

credential_types:
  - id: bot
    label: Bot token
    slug: bot
    secret_label: Bot token from BotFather
    # `*` is the /bot<placeholder> segment. Only what the skill sends; any
    # other method goes out untouched and Telegram answers 404.
    routes:
      - path: /*/getMe
        methods: [GET, POST]
      - path: /*/getUpdates
        methods: [GET, POST]
      - path: /*/getChat
        methods: [GET, POST]
      - path: /*/sendMessage
        methods: [POST]
      - path: /*/sendPhoto
        methods: [POST]
      - path: /*/sendDocument
        methods: [POST]
      - path: /*/editMessageText
        methods: [POST]
      - path: /*/deleteMessage
        methods: [POST]
    delivery:
      mode: replace
      match_path: true
    summary: >-
      Sets: the placeholder is swapped for the bot token in the URL path, on the
      Bot API methods the skill uses: getMe, getUpdates, getChat, sendMessage,
      sendPhoto, sendDocument, editMessageText and deleteMessage.

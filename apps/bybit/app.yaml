# Bybit (v5 unified API).
#
# The first bundle written against the format rather than derived from it, so
# it is also the test of whether the format generalises. It needed no code
# change: hmac-sha256 with hex output already ships, and the signature goes in
# a header, which is the substitution the proxy has always done.
#
# WHAT MADE BYBIT DIFFERENT from Paradex, and it is the one thing worth
# reading before changing anything here: Bybit's signature covers the API KEY
# ITSELF. The signed string is
#
#     timestamp + api_key + recv_window + (query string | request body)
#
# so the agent cannot form the payload without knowing the api key. That rules
# out holding the api key as a sealed credential the agent never sees — there
# is no arrangement in which the agent does not know it — so it is carried as
# a PUBLIC DETAIL and the agent writes the X-BAPI-API-KEY header itself.
#
# That is a deliberate choice and not a shortcut. The api key alone cannot
# place an order, read a balance or move a coin: every private Bybit endpoint
# also demands X-BAPI-SIGN, and producing one needs the secret, which stays
# sealed and never reaches the agent. Sealing an identifier the signing scheme
# requires the holder to know would be theatre, and theatre that breaks the
# venue.

schema_version: 1

id: bybit
version: 1.0.1
name: Bybit
blurb: Trade spot, perpetuals and options on Bybit with a secret your agent never holds.

description: |
  Bybit is a centralised exchange offering spot, perpetual futures, futures and
  options through one unified v5 API.

  This app installs a skill teaching your agent Bybit's v5 request signing —
  which is unusual enough that it will not get there from Bybit's own
  documentation alone — and adds Bybit to the credentials form so you can enrol
  your API secret without filling in the signing details by hand.

  You paste two things from Bybit's API management page: the **API key**, which
  is an identifier and is stored as ordinary metadata, and the **API secret**,
  which is sealed and never reaches your agent. Every private request is signed
  by the credential proxy using the secret; your agent only ever says what it
  wants signed.

  **Private WebSocket streams are not covered.** Bybit authenticates those with
  a signature sent in a frame after the connection is open, and the proxy signs
  HTTP requests, not WebSocket frames. Public market-data streams work
  normally. See the skill for what to do instead.


developer: Bybit
developer_url: https://www.bybit.com
tint: "#F6A500"

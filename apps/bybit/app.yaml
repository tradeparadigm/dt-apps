environments:
  - id: mainnet
    label: Mainnet
    host: api.bybit.com
  - id: testnet
    label: Testnet
    host: api-testnet.bybit.com
  - id: demo
    label: Demo trading
    host: api-demo.bybit.com

# One credential type, so exclusivity would not bind either way. Stated
# explicitly rather than left to the default because the next person to add a
# second type needs to make this decision deliberately: the secret's routes
# already demand its placeholder on every private endpoint, so a second
# credential covering those same routes would break this one.
exclusive_credential_types: true

credential_types:
  - id: secret
    label: API secret (signing)
    slug: secret
    secret_label: API secret
    # The api key is public metadata, not a second credential — see the header
    # comment. The agent reads it from here and writes X-BAPI-API-KEY itself.
    detail_fields:
      - key: api_key
        label: API key
        placeholder: "XXXXXXXXXXXXXXXXXX"
    # Every private v5 endpoint, grouped by the prefixes Bybit itself uses.
    # Bybit splits public from private cleanly — market data is /v5/market/*
    # and nothing else is public — so a prefix per private family covers the
    # whole authenticated surface without touching a single public read.
    #
    # THE RULE THAT MATCHES IS THE RULE THAT REQUIRES THE PLACEHOLDER, so this
    # list is the exact set of paths on which a request WITHOUT an
    # X-BAPI-SIGN placeholder is refused by the proxy. /v5/market/* is
    # deliberately absent: a ticker or a kline needs no signature, and listing
    # it here would refuse every public read the agent makes.
    #
    # No method narrowing. Each family carries both reads and writes — GET
    # /v5/order/realtime lists open orders, POST /v5/order/create places one —
    # and both are signed, so narrowing by method would only create a gap.
    routes:
      - path: /v5/order/*
      - path: /v5/position/*
      - path: /v5/execution/*
      - path: /v5/account/*
      - path: /v5/asset/*
      - path: /v5/user/*
      - path: /v5/spot-margin-trade/*
    # match_headers rather than the default of scanning every header: the
    # signature has exactly one home on Bybit and naming it keeps the scan
    # off headers that have no business being rewritten.
    delivery:
      mode: sign
      scheme: hmac-sha256
      encoding: hex
      match_headers: [X-BAPI-SIGN]
    summary: >-
      Sets: signing credential, HMAC-SHA256, hex, substituted into the
      X-BAPI-SIGN header, on every path under /v5/order, /v5/position,
      /v5/execution, /v5/account, /v5/asset, /v5/user and
      /v5/spot-margin-trade.

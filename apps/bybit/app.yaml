# Bybit (v5 unified API), through the exchange-mcp server.
#
# The agent calls `bybit__*` tools and never builds a request. The server
# signs through the credential proxy: it sends the bytes Bybit signs in
# X-Dime-Sign-<label> and the placeholder in X-BAPI-SIGN, and the proxy
# substitutes the HMAC. Bybit's signed bytes include the API key, so the key
# is a public detail the server sends as X-BAPI-API-KEY. The key alone cannot
# read or trade; every private call also needs the secret, which stays sealed.

schema_version: 1

id: bybit
version: 1.3.0
name: Bybit
blurb: Trade Bybit perpetuals, futures and options with a secret your agent never holds.

# What a user would type when asking for what this app does.
tags:
  - bybit

# What this app is for, on two axes that do not imply each other:
# whether its credentials can write, and whether it has been exercised
# enough to sit alongside the rest.
#
# NOT VERSIONED. These are served from the catalogue listing rather
# than from the files an account pinned, so a change here reaches
# everyone at the next refresh. Bumping `version` would offer every
# installed app an update that changes no skill text.
access: read-write
maturity: stable

description: |
  Bybit is a centralised exchange with perpetuals, futures, options and spot
  on one unified v5 API.

  This app gives your agent Bybit tools for balances, positions, orders,
  fills, funding and market data on USDT and USDC perpetuals and futures, and
  option chains, greeks and orders on mainnet and testnet. It also adds Bybit
  to the credentials form.

  You paste two things from Bybit's API management page: the **API key**,
  stored as ordinary metadata, and the **API secret**, which is sealed and
  never reaches your agent. The credential proxy signs every private request.

  Spot, inverse contracts, transfers and private WebSocket streams are not
  covered yet, and options are not available on demo.

developer: Bybit
developer_url: https://www.bybit.com
tint: "#F6A500"
icon:
  path: "M15.829 13.626V9h.93v4.626zM4.993 15H3v-4.626h1.913c.93 0 1.471.507 1.471 1.3 0 .513-.348.845-.588.955.287.13.655.423.655 1.04 0 .863-.609 1.33-1.458 1.33m-.154-3.82h-.91v1.065h.91c.395 0 .615-.214.615-.533 0-.317-.22-.532-.615-.532m.06 1.877h-.97v1.137h.97c.42 0 .622-.259.622-.571s-.201-.565-.622-.565zm4.388.046V15h-.923v-1.898l-1.431-2.728h1.01l.889 1.864.877-1.864h1.01zM13.355 15h-1.993v-4.626h1.913c.93 0 1.47.507 1.47 1.3 0 .513-.347.845-.588.955.287.13.655.423.655 1.04 0 .863-.608 1.33-1.457 1.33m-.155-3.82h-.91v1.065h.91c.395 0 .616-.214.616-.533 0-.317-.22-.532-.616-.532m.06 1.877h-.97v1.137h.97c.422 0 .622-.259.622-.571s-.2-.565-.622-.565zm6.495-1.876V15h-.929v-3.82h-1.245v-.806H21v.806z"
  view_box: "0 0 24 24"
environments:
  - id: mainnet
    label: Mainnet
    host: api.bybit.com
  - id: testnet
    label: Testnet
    host: api-testnet.bybit.com
  - id: demo
    label: Demo trading
    host: api-demo.bybit.com

# One credential type. Its routes require the placeholder on every private
# endpoint, so a second type covering the same routes would break this one.
exclusive_credential_types: true

credential_types:
  - id: secret
    label: API secret (signing)
    slug: secret
    secret_label: API secret
    # Public: Bybit's signed bytes include it, and the server sends it.
    detail_fields:
      - key: api_key
        label: API key
        placeholder: "XXXXXXXXXXXXXXXXXX"
    # The private v5 families the server calls. /v5/market/* is public and
    # absent, because a route here refuses any request without the placeholder.
    routes:
      - path: /v5/order/*
      - path: /v5/position/*
      - path: /v5/execution/*
      - path: /v5/account/*
      - path: /v5/asset/*
      - path: /v5/user/*
    delivery:
      mode: sign
      scheme: hmac-sha256
      encoding: hex
      match_headers: [X-BAPI-SIGN]
    summary: >-
      Sets: signing credential, HMAC-SHA256, hex, substituted into the
      X-BAPI-SIGN header, on every path under /v5/order, /v5/position,
      /v5/execution, /v5/account, /v5/asset and /v5/user.

# Product lines are env flags on the one server: each one the server and
# safe-cex support on Bybit's unified account becomes another flag here.
mcp_server:
  command: npx
  args: ["-y", "@tealstreet/exchange-mcp@0.2.0"]
  credential_types:
    - type: secret
      env:
        EXCHANGE_API_KEY: "${detail.api_key}"
        EXCHANGE_SIGNER_HEADER: "X-Dime-Sign-${label}"
        EXCHANGE_SIGNER_SIGNATURE: "${placeholder}"
  environments:
    - id: mainnet
      env:
        EXCHANGE: bybit
        EXCHANGE_OPTIONS: "true"
    - id: testnet
      env:
        EXCHANGE: bybit
        EXCHANGE_TESTNET: "true"
        EXCHANGE_OPTIONS: "true"
    - id: demo
      env:
        EXCHANGE: bybitdemo

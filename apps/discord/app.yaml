# Discord REST API as a bot. The token goes in the Authorization header as
# `Bot <token>`, so this is replace mode on that header.

schema_version: 1

id: discord
version: 1.0.0
name: Discord
blurb: Post to your Discord channels from a bot whose token your agent never holds.

# Not versioned: served from the catalogue listing.
access: read-write
maturity: beta

description: |
  Discord is a chat app organised into servers and channels. A bot you create
  in Discord's Developer Portal can post into the servers you invite it to.

  This app installs a skill teaching your agent to send messages and files
  through your bot, find the channels it can reach, read recent messages, and
  message you directly. You paste the **bot token**. It stays sealed: your
  agent sends a placeholder and the credential proxy swaps in the token on the
  way out.

  To make a bot: open the Developer Portal, create an application, open
  **Bot** and press **Reset Token** to copy the token. To invite it, open
  **OAuth2 → URL Generator**, tick the `bot` scope and the View Channels, Send
  Messages, Attach Files and Read Message History permissions, then open the
  link and pick your server. Turn on **Message Content Intent** under Bot if
  you want your agent to read what people write.

  **One bot at a time.** Two Discord bots enrolled together make each other's
  requests fail, so revoke the old one before enrolling another.

developer: Discord
developer_url: https://discord.com/developers/docs/intro
tint: "#5865F2"

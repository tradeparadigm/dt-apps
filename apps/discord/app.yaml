  view_box: "0 0 24 24"
environments:
  - id: api
    label: Bot API
    host: discord.com

exclusive_credential_types: true

credential_types:
  - id: bot
    label: Bot token
    slug: bot
    secret_label: Bot token from the Discord Developer Portal
    # `*` is one id segment. Only what the skill sends; any other path goes out
    # untouched and Discord answers 401.
    routes:
      - path: /api/v10/users/@me
        methods: [GET]
      - path: /api/v10/users/@me/guilds
        methods: [GET]
      - path: /api/v10/users/@me/channels
        methods: [POST]
      - path: /api/v10/guilds/*/channels
        methods: [GET]
      - path: /api/v10/channels/*/messages
        methods: [GET, POST]
      - path: /api/v10/channels/*/messages/*
        methods: [PATCH, DELETE]
    delivery:
      mode: replace
      match_headers: [Authorization]
    summary: >-
      Sets: the placeholder is swapped for the bot token in the Authorization
      header, on the API calls the skill makes: the bot's own account, its
      servers and their channels, opening a direct message, and reading,
      sending, editing and deleting channel messages.
